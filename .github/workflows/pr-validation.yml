name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:

  # ── 1. Commit message lint ────────────────────────────────────────────────
  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ── 2. ESLint (LWC) ──────────────────────────────────────────────────────
  eslint:
    name: ESLint (LWC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

  # ── 3. Prettier format check ─────────────────────────────────────────────
  prettier:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

  # ── 4. LWC Jest unit tests + coverage ────────────────────────────────────
  jest:
    name: LWC Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Jest tests with coverage
        run: npm run test:unit:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/

  # ── 5. npm audit (dependency security) ───────────────────────────────────
  npm-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ── 6. Salesforce Code Analyzer (PMD + ESLint Apex) ──────────────────────
  code-analyzer:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Install Code Analyzer plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Code Analyzer on force-app
        run: |
          sf scanner run \
            --target "force-app/**/*.cls,force-app/**/*.js" \
            --engine "pmd,eslint" \
            --pmdconfig config/pmd-ruleset.xml \
            --severity-threshold 2 \
            --format csv \
            --outfile code-analyzer-results.csv || true
          if [ -f code-analyzer-results.csv ] && [ -s code-analyzer-results.csv ]; then
            echo "Code Analyzer violations found:"
            cat code-analyzer-results.csv
          else
            echo "No violations found."
          fi

      - name: Upload Code Analyzer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.csv

  # ── 7. XML metadata validation ────────────────────────────────────────────
  xml-lint:
    name: XML Metadata Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML metadata files
        run: |
          python3 - <<'EOF'
          import os, sys
          import xml.etree.ElementTree as ET

          errors = []
          for root, dirs, files in os.walk('force-app'):
              for f in files:
                  if f.endswith('.xml'):
                      path = os.path.join(root, f)
                      try:
                          ET.parse(path)
                      except ET.ParseError as e:
                          errors.append(f"{path}: {e}")

          if errors:
              print(f"{len(errors)} XML file(s) failed validation:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print(f"All XML files are valid.")
          EOF

  # ── 8. Salesforce check-only deploy + Apex tests ─────────────────────────
  sf-validate:
    name: Salesforce Check-Only Deploy
    runs-on: ubuntu-latest
    needs: [eslint, prettier, xml-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate to Salesforce Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias target-org --set-default
          rm -f ./auth-url.txt

      - name: Check-Only Deploy + RunLocalTests
        run: |
          OUTPUT=$(sf project deploy validate \
            --source-dir force-app \
            --target-org target-org \
            --test-level RunLocalTests \
            --wait 30 2>&1) || {
            if echo "$OUTPUT" | grep -q "NothingToDeploy"; then
              echo "No metadata to deploy — validation passed."
              exit 0
            fi
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
