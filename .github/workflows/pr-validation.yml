name: PR Validation (Check-Only Deploy)

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Metadata (Check-Only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate to Salesforce Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias target-org --set-default
          rm -f ./auth-url.txt

      - name: Check-Only Deploy (Validate)
        run: |
          OUTPUT=$(sf project deploy validate \
            --source-dir force-app \
            --target-org target-org \
            --test-level RunLocalTests \
            --wait 30 2>&1) || {
            if echo "$OUTPUT" | grep -q "NothingToDeploy"; then
              echo "No metadata to deploy — validation passed."
              exit 0
            fi
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"

      - name: Report Validation Result
        if: always()
        run: echo "Validation complete. Check logs above for details."
